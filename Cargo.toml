[package]
name = "buch"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "buch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
half = "2.7.1"
memmap2 = "0.9.12"
serde_json = "1.0.154"
ureq = { version = "3", features = ["json"] }
tiny_http = "0.12"
rayon = "1.12.0"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
memchr = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tantivy = "0.27.0"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
zstd = "0.14.3"
dirs = "6"
pdf-extract = "0.9"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["accelerate"] }
